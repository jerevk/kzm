name: KZM backups moved to private repository

on:
  workflow_dispatch:

permissions: {}

jobs:
  backup-location:
    name: Private backup location
    runs-on: ubuntu-latest
    steps:
      - name: Show the private backup workflow
        shell: bash
        run: |
          echo 'Daily encrypted backups run in the private repository:'
          echo 'https://github.com/jerevk/kzm-backups/actions/workflows/backup-d1.yml'
          echo 'Open that workflow to run or download a backup.'
